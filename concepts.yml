  latitude: [lat, y, latitude_deg]
  longitude: [lng, lon, long, x, longitude_deg]
  address: [formatted_address, display_name, label, full_address, address_line, formatted, place_name, freeform_address, address_label]
  name: [title, display_name_short, text, place_name_short]
  country: [country_code, country_name, iso_country_code]
  postal_code: [postcode, zip, zipcode, postal]
  city: [locality, town, municipality, place]
  region: [state, province, admin1, administrative_area_level_1, county]
  geometry: [location, coordinates, point, center, position, geocodes, bbox, bounds, viewport]
  confidence: [score, relevance, accuracy, match_quality, quality, importance]

