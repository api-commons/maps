exclude:
  geocode:
    apifreaks-api-hub-for-developers: /domain/dns/reverse is a reverse DNS lookup
  place:
    2s-io: /geo/nearby aggregates airports, schools and climate stations
  route:
    roxyapi: /vastu/directions are compass directions in Vastu
duplicates:
  hivemapper: [bee-maps]

findings:
  - "A geocode agrees on an address, a name, a country, a confidence score, coordinates and a
    geometry -- once GeoJSON is read as GeoJSON. Pelias-style geocoders return
    FeatureCollections whose fields live under each Feature's `properties`."
  - "A place agrees on id, name, geometry and address; categories and opening hours are
    modelled by too few to share."
  - "A route agrees on nothing: routing engines publish their request options (costing,
    profiles, avoidances) far more than a result shape, and Valhalla, OSRM and the commercial
    APIs each return legs and geometry differently."
  - "A distance matrix agrees on its origins and destinations."
decisions:
  - "Maps concepts are results, not resources: a geocode is what `/geocode`, `/reverse` and
    address search return."
  - "GeoJSON is read as a standard: the census unwraps `features` and lifts a Feature's
    `properties` beside its geometry (a census change that applies to every context)."
  - "Points of interest, nearby search and place autocomplete are places; directions and
    route optimisation are routes; sources-to-targets is a distance matrix."
  - "A reverse DNS lookup and Vastu compass directions are not maps (excluded by name)."
  - "Duplicates merged: Bee Maps into Hivemapper."
