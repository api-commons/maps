context: maps
name: Maps and Geocoding
intro: >-
  The common maps vocabulary -- the geocodes that turn addresses into coordinates and back,
  the places and points of interest on the map, the routes between them and the distance
  matrices that compare many at once -- distilled from the APIs that already exist. Maps
  APIs are operations more than resources, so each concept is the shape of a result.
tags: [Geocoding, Mapping, Maps, GIS, Routing, Location, Location Intelligence, Navigation, Places, Geospatial]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, features, query, attribution, type, info, status]

