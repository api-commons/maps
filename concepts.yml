  route:
    segments: [routes, route, directions, direction, routing, navigation@route|routes, optimized-trips, optimization@route|routes]
    aliases:
      distance: [distance_meters, length, length_in_meters, total_distance, summary_distance]
      duration: [duration_seconds, travel_time, time, travel_time_in_seconds, total_duration]
      polyline: [geometry_polyline, overview_polyline, shape, encoded_polyline, path, points]
