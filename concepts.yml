  geocode:
    segments: [geocode, geocoding, geocoder, reverse, forward, search@geocode|geocoding|address|addresses, autocomplete@address|geocode, address_lookup, validate@address, "addresses@verify|validation"]
    aliases:
      components: [address_components, address_details, components_list, properties]
      type: [result_type, types, layer, match_type, place_type, feature_type]
  place:
    segments: [places, place, pois, poi, points_of_interest, venues@places|search, nearby, nearbysearch, autocomplete@places]
    aliases:
      category: [categories, types, type, poi_category, amenity, kind]
      phone: [phone_number, tel, international_phone_number]
      rating: [stars, user_rating]
      website: [url, website_url]
