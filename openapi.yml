            application/json:
              schema:
                type: array
                items: *id004
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
components:
  schemas:
    Geocode:
      $ref: ./schema/geocode.json
    Place:
