      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createRoute
      summary: Create a route
      tags:
      - Routes
      x-commons-tier: extended
      x-commons-share: 0.4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
