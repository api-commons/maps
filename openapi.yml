      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createPlace
      summary: Create a place
      tags:
      - Places
      x-commons-tier: extended
      x-commons-share: 0.2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /places/{place_id}:
    parameters:
    - $ref: '#/components/parameters/place_id'
    get:
      operationId: getPlace
      summary: Get a place
      tags:
      - Places
      x-commons-tier: extended
      x-commons-share: 0.32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
  /routes:
    get:
      operationId: listRoutes
      summary: List routes
      tags:
