openapi: 3.1.0
info:
  title: Maps and Geocoding (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Maps and Geocoding interface, distilled from the harvested OpenAPI of 193 providers in
    the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /geocodes:
    get:
      operationId: listGeocodes
      summary: List geocodes
      tags:
      - Geocodes
      x-commons-tier: core
      x-commons-share: 0.864
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Geocode'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createGeocode
      summary: Create a geocode
      tags:
      - Geocodes
      x-commons-tier: extended
      x-commons-share: 0.227
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /places:
    get:
      operationId: listPlaces
      summary: List places
      tags:
      - Places
      x-commons-tier: core
      x-commons-share: 0.72
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
